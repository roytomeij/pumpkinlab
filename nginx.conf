# Served behind Traefik (TLS); plain HTTP inside the Docker network.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off; # never redirect to http://<container>:8080

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # File names carry no version, so browsers revalidate every file (a cheap 304): after a deploy
    # nobody runs a new index.html with stale ES modules.
    add_header Cache-Control no-cache always;

    location / {
        try_files $uri $uri/ =404;
    }
}
